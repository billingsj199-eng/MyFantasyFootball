# Live-projection tracker — runs in the cloud at every NFL kickoff window so
# the home machine can be off. scripts/live_tracker/live_tracker.py --all
# tracks every game kicking off within 2h (or in progress), one row per
# player per minute, and grades the slate against the finals when it ends.
# Results are committed to the `live-tracker-logs` branch (never main), and
# games are claimed there so the EDT+EST cron pairs and the overlapping
# Sunday windows never double-track a game.
#
# Cron is UTC. Each local slot is listed FOUR times: a LEAD run 67 min before
# the window and a MAIN run just after it, each in EDT (UTC-4 until Nov 1)
# and EST (UTC-5 after). The lead run claims the games and waits for kickoff
# (the tracker's --window 2 already covers that), so a GitHub cron delay of
# up to an hour still catches kickoff; the main run is the fallback and
# normally finds the games already claimed (exits in seconds). Minutes avoid
# the top of the hour. Why: on 2026-09-10 GitHub started the 00:05/01:05 UTC
# crons at 04:25 and 05:52 UTC, 4.5h late, and the W1 opener was already
# FINAL — the results branch never saw the game.
# 2026-10-11: cron schedule REMOVED (Jack, cutting background runs) — manual
# "Run workflow" only. Restore the schedule block from git history to re-enable.
name: Live projection tracker

on:
  workflow_dispatch:
    inputs:
      teams:
        description: "Explicit teams (e.g. NE,SEA); blank = --all within the window"
        required: false
        default: ""
      window:
        description: "Hours ahead to look for kickoffs (--all)"
        required: false
        default: "2"

permissions:
  contents: write

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Checkout main (tracker script)
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/live_tracker
          sparse-checkout-cone-mode: true
      - name: Checkout live-tracker-logs (results branch)
        uses: actions/checkout@v4
        with:
          ref: live-tracker-logs
          path: logs
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install --quiet requests
      - name: Git identity (logs branch)
        run: |
          git -C logs config user.name "mff-live-tracker"
          git -C logs config user.email "live-tracker@myfantasyfootball.co"
      - name: Track
        env:
          TRACKER_GIT: "1"
          PYTHONUNBUFFERED: "1"
        run: |
          if [ -n "${{ github.event.inputs.teams }}" ]; then
            python scripts/live_tracker/live_tracker.py --teams "${{ github.event.inputs.teams }}" --logs-dir logs/data
          else
            python scripts/live_tracker/live_tracker.py --all --window "${{ github.event.inputs.window || '2' }}" --logs-dir logs/data
          fi
