# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # Minify app.js IN THE DEPLOY ARTIFACT ONLY — the repo keeps unminified source,
      # so the edit-and-push workflow is unchanged. Same filename + ?v= URL, so
      # index.html and the service worker need no awareness of this step.
      # --keep-fnames: inline HTML handlers + cross-file globals rely on top-level
      # names (never mangled) and some code paths read fn.name — keep both safe.
      # If terser or the syntax check fails, the whole deploy fails and the site
      # keeps serving the previous build (never a broken artifact).
      - name: Minify app.js
        run: |
          npx -y terser@5 app.js --compress --mangle --keep-fnames --comments false -o app.min.tmp.js
          node --check app.min.tmp.js
          echo "app.js: $(wc -c < app.js) -> $(wc -c < app.min.tmp.js) bytes"
          mv app.min.tmp.js app.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
