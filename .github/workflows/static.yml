# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      # Minify app.js IN THE DEPLOY ARTIFACT ONLY — the repo keeps unminified source,
      # so the edit-and-push workflow is unchanged. Same filename + ?v= URL, so
      # index.html and the service worker need no awareness of this step.
      # --keep-fnames: inline HTML handlers + cross-file globals rely on top-level
      # names (never mangled) and some code paths read fn.name — keep both safe.
      # If terser or the syntax check fails, the whole deploy fails and the site
      # keeps serving the previous build (never a broken artifact).
      # Split app.js IN THE DEPLOY ARTIFACT ONLY (mobile perf phase 3, 2026-10-13):
      # sections fenced with //#chunk <name> … //#endchunk <name> become
      # app-chunk-<name>.js, loaded on demand by window._ensureChunk (switchPage);
      # the core keeps the app.js name/?v= and gains `window._MFF_CHUNKS = [...]`.
      # The script's acorn gate FAILS the deploy if code outside a chunk uses the
      # chunk's names without a guard (see scripts/split_app.js). Chunk URLs carry
      # the same ?v= as app.js, so the service worker caches them like app.js.
      - name: Split app.js into core + lazy chunks
        run: |
          npm i --no-save --no-audit --no-fund --prefix .build-tools acorn@8.12.1 acorn-walk@8.3.4
          node scripts/split_app.js --build
          for n in $(node -e "const m=/window\._MFF_CHUNKS = (\[.*?\]);/.exec(require('fs').readFileSync('app.js','utf8'));console.log(m?JSON.parse(m[1]).join(' '):'')"); do test -s "app-chunk-$n.js"; done
          rm -rf .build-tools
      - name: Minify app.js
        run: |
          for f in app.js app-chunk-*.js; do
            [ -f "$f" ] || continue
            npx -y terser@5 "$f" --compress "pure_funcs=['console.log','console.info','console.debug']" --mangle --keep-fnames --comments false -o app.min.tmp.js
            node --check app.min.tmp.js
            echo "$f: $(wc -c < "$f") -> $(wc -c < app.min.tmp.js) bytes"
            mv app.min.tmp.js "$f"
          done
      # Minify data/*.js IN THE DEPLOY ARTIFACT ONLY (same pattern as app.js).
      # esbuild in non-bundle script mode strips whitespace/comments but never
      # renames top-level identifiers (verified locally: `const D=` /
      # `var KTC_1QB=` survive), so cross-file globals and inline readers are
      # safe. ~7 MB less raw JS for the browser to parse (59 -> 52 MB); the
      # over-the-wire win is small since Pages gzips anyway. Runs in ~3 s.
      # The grep guard fails the deploy if a future esbuild version ever
      # starts renaming top-level names (node --check alone wouldn't catch it).
      # data/*.json (extension live-fetch) is untouched.
      - name: Minify data files
        run: |
          npx -y esbuild@0.21.5 data/*.js --minify --charset=utf8 --outdir=data.min --log-level=error
          for f in data.min/*.js; do node --check "$f"; done
          grep -q 'const D=' data.min/d.js
          echo "data/*.js: $(du -sk data | cut -f1) KB -> $(du -sk data.min | cut -f1) KB"
          cp data.min/*.js data/
          rm -rf data.min
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
