const q = new URLSearchParams(location.search);
const v = V[q.get('p')] || V.site;

document.documentElement.style.setProperty('--glow', v.accent + '30');
document.documentElement.style.setProperty('--glow2', v.accent + '14');
const titleEl = document.getElementById('title');
(v.title || '').split('\n').forEach((line, i) => { if (i) titleEl.appendChild(document.createElement('br')); titleEl.appendChild(document.createTextNode(line)); });
document.getElementById('tag').textContent = v.tag || '';
(v.bullets || []).forEach((t) => {
  const d = document.createElement('div'); d.className = 'b';
  const s = document.createElement('span'); s.textContent = t;
  d.appendChild(s); document.getElementById('bullets').appendChild(d);
});
if (v.store) {
  const s = document.createElement('div'); s.id = 'store'; s.textContent = v.store;
  document.getElementById('storewrap').appendChild(s);
}
if (v.hero) {
  document.getElementById('copy').style.display = 'none';
  document.getElementById('stage').style.display = 'none';
  const h = document.createElement('div');
  h.id = 'hero';
  h.innerHTML = v.hero;
  document.body.appendChild(h);
}
if (v.panelStyle) document.getElementById('panel').style.cssText += v.panelStyle;
if (v.stageStyle) document.getElementById('stage').style.cssText += v.stageStyle;
document.getElementById('panel').innerHTML = v.panel || '';
document.title = 'STAGED';
</script>
