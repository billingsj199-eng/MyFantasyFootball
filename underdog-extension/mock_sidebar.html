<!doctype html>
<meta charset="utf-8">
<title>MFF Underdog — real sidebar.js harness</title>
<!-- Dev harness (not packaged). Runs the REAL engine.js + sidebar.js (mock.html only runs a
     stand-in UI from sidebar.html). chrome.* is stubbed; a draft is seeded in storage.
     Query params:
       route=draft|lobby   pushState to /draft/<uuid> (default) or /lobby before boot
       preload=1           load data/bbm_data.js as a script tag first (the pre-0.18.26 way)
       sb=<file>           sidebar script to run (default sidebar.js)
       picks=<n>           players already drafted (ADP order) before my turn (default 28)
       user=none|free|stale  lock-screen states (default: fresh premium user)  -->
<style>body{font:14px system-ui;background:#1b1d22;color:#ddd;margin:0;padding:20px}</style>
<h1 style="font-size:16px">UD real-sidebar harness</h1>
<pre id="log"></pre>
<script>
(async () => {
  const BASE = '/underdog-extension/';
  const qs = new URLSearchParams(location.search);
  const route = qs.get('route') || 'draft';
  const DRAFT_ID = '0123abcd-4567-89ab-cdef-0123456789ab';
  const store = {};
  const listeners = [];
  window.chrome = {
    runtime: {
      id: 'mock', lastError: undefined,
      getURL: (p) => BASE + p,
      getManifest: () => ({ version: 'mock' }),
      sendMessage: (m, cb) => { if (typeof cb === 'function') setTimeout(() => cb(undefined), 0); },
      onMessage: { addListener() {} },
    },
    storage: {
      local: {
        get: (keys, cb) => { const o = {}; const ks = keys == null ? Object.keys(store) : Array.isArray(keys) ? keys : typeof keys === 'string' ? [keys] : Object.keys(keys); for (const k of ks) if (k in store) o[k] = JSON.parse(JSON.stringify(store[k])); const p = Promise.resolve(o); if (cb) setTimeout(() => cb(o), 0); return p; },
        set: (obj, cb) => { for (const k in obj) store[k] = JSON.parse(JSON.stringify(obj[k])); if (cb) setTimeout(cb, 0); return Promise.resolve(); },
        remove: (k, cb) => { (Array.isArray(k) ? k : [k]).forEach((x) => delete store[x]); if (cb) setTimeout(cb, 0); return Promise.resolve(); },
        getBytesInUse: (k, cb) => { if (cb) setTimeout(() => cb(0), 0); return Promise.resolve(0); },
      },
      onChanged: { addListener: (f) => listeners.push(f) },
    },
  };
  window.__mffMockStore = store;
  // seed: premium user + a draft at my pick
  const pj = await (await fetch(BASE + 'data/players.json')).json();
  const byAdp = pj.players.filter((p) => p.udA).sort((a, b) => a.udA - b.udA).map((p) => p.n);
  const n = +(qs.get('picks') || 28);
  const mine = [byAdp[4], byAdp[19]];
  const drafted = byAdp.slice(0, n + 2).filter((x) => !mine.includes(x));
  // user=none|free|stale shows the lock screen states (default = fresh premium)
  const um = qs.get('user');
  if (um === 'free') store.mff_user = { email: 'mock@example.com', premium: false, syncedAt: Date.now() };
  else if (um === 'stale') store.mff_user = { email: 'mock@example.com', premium: true, syncedAt: Date.now() - 30 * 3600 * 1000 };
  else if (um !== 'none') store.mff_user = { email: 'mock@example.com', premium: true, syncedAt: Date.now() };
  store['mff_draft_' + DRAFT_ID] = { version: 1, savedAt: Date.now(), slot: 5, teamSize: 12, pickNum: n + 1, mode: 'manual',
    drafted, myRoster: mine, history: [], rankSrc: null, posFilter: 'ALL', sortBy: null, isSuperflex: false, isRedraft: false, superflexSource: null };
  history.pushState(null, '', route === 'draft' ? '/draft/' + DRAFT_ID : '/lobby');
  const files = ['data/bbm_pick_by_rank_round.js', 'data/bbm_path_optimal.js', 'data/bbm_stack_comp_multistage.js',
    'data/bbm_structural_multistage.js', 'data/playoff_sos_2026.js', 'engine.js', 'mff-gloss.js', qs.get('sb') || 'sidebar.js', 'live-watcher.js', 'draft-button-pad.js'];
  if (qs.get('preload') === '1') files.unshift('data/bbm_data.js');
  const link = document.createElement('link'); link.rel = 'stylesheet'; link.href = BASE + 'sidebar.css'; document.head.appendChild(link);
  for (const f of files) {
    await new Promise((res, rej) => { const s = document.createElement('script'); s.src = BASE + f; s.onload = res; s.onerror = () => rej(new Error(f)); document.head.appendChild(s); });
  }
  document.getElementById('log').textContent = 'route=' + route + ' preload=' + (qs.get('preload') || 0) + ' sb=' + (qs.get('sb') || 'sidebar.js') + ' drafted=' + drafted.length;
})();
</script>
