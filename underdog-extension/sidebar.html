<div id="mff-sidebar">
  <div id="mff-header">
    <div class="title">MFF DRAFT HELPER</div>
    <div class="controls">
      <button id="mff-collapse" title="Collapse">_</button>
      <button id="mff-close" title="Hide">×</button>
    </div>
  </div>
  <div id="mff-body">

    <!-- Setup (shown until slot is chosen) -->
    <div id="mff-setup" class="mff-section">
      <h3>Draft Setup</h3>
      <label>Your slot (1–12):</label>
      <div class="slot-row" id="mff-slot-grid"></div>
      <button class="start-btn" id="mff-start">Start Tracking</button>
    </div>

    <!-- Status -->
    <div class="mff-section" id="mff-status-wrap" style="display:none">
      <h3>Status</h3>
      <div id="mff-status">
        <div class="stat"><div class="v" id="s-pick">—</div><div class="l">Pick</div></div>
        <div class="stat"><div class="v" id="s-round">—</div><div class="l">Round</div></div>
        <div class="stat"><div class="v" id="s-mypicks">0</div><div class="l">Mine</div></div>
        <div class="stat"><div class="v" id="s-until">—</div><div class="l">Until next</div></div>
      </div>
      <div id="mff-mode">
        <span>Mode:</span>
        <span class="badge manual" id="mff-mode-badge">MANUAL</span>
      </div>
    </div>

    <!-- Roster -->
    <div class="mff-section" id="mff-roster-wrap" style="display:none">
      <h3>Roster</h3>
      <div id="mff-roster">
        <div class="pos" data-pos="QB"><div class="v" id="r-QB">0</div><div class="l">QB</div></div>
        <div class="pos" data-pos="RB"><div class="v" id="r-RB">0</div><div class="l">RB</div></div>
        <div class="pos" data-pos="WR"><div class="v" id="r-WR">0</div><div class="l">WR</div></div>
        <div class="pos" data-pos="TE"><div class="v" id="r-TE">0</div><div class="l">TE</div></div>
      </div>
      <div id="mff-flags"></div>
    </div>

    <!-- Recommendations -->
    <div class="mff-section" id="mff-recs-wrap" style="display:none">
      <h3>Recommended</h3>
      <div id="mff-recs"></div>
    </div>

    <!-- Manual pick entry -->
    <div class="mff-section" id="mff-manual-wrap" style="display:none">
      <h3>Log Pick (any team)</h3>
      <div id="mff-manual">
        <input type="text" id="mff-search" placeholder="Search a player..." autocomplete="off">
        <div id="mff-suggestions"></div>
        <div class="row">
          <button id="mff-add-mine">Add to MY Roster</button>
          <button class="alt" id="mff-add-other">Drafted (other)</button>
        </div>
        <div class="row">
          <button class="alt" id="mff-undo">Undo Last</button>
          <button class="alt" id="mff-reset">Reset Draft</button>
        </div>
      </div>
    </div>
  </div>
</div>
